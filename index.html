<style>
  html, body, #root { height: 100%; margin: 0; padding: 0; }
  body { -webkit-font-smoothing: antialiased; overscroll-behavior: none; background:#18100D; }
  #boot-error { display:none; position:fixed; inset:0; background:#18100D; color:#F4EEDD;
    padding:20px; font-family:monospace; font-size:13px; line-height:1.6;
    white-space:pre-wrap; overflow:auto; z-index:9999; }
</style>
<script>
  function showBootError(msg) {
    var el = document.getElementById('boot-error');
    if (!el) return;
    el.style.display = 'block';
    el.textContent = "This page failed to load:\n\n" + msg +
      "\n\n— Check your internet connection\n— Try disabling any ad/content blocker for this site\n— Try a different browser or network (e.g. switch off VPN)\n— Then reload the page";
  }
  window.addEventListener('error', function (e) {
    showBootError((e.error && e.error.stack) || e.message || String(e.error || e));
  });
  window.addEventListener('unhandledrejection', function (e) {
    var reason = e.reason;
    showBootError('Unhandled error: ' + (reason && reason.message ? reason.message : String(reason)));
  });
</script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin onerror="showBootError('Failed to load React from unpkg.com.')"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin onerror="showBootError('Failed to load ReactDOM from unpkg.com.')"></script>

<body>
<div id="root"></div>
<div id="boot-error"></div>
<script>
  setTimeout(function () {
    var root = document.getElementById('root');
    var errEl = document.getElementById('boot-error');
    if (root && root.children.length === 0 && errEl.style.display !== 'block') {
      showBootError('Nothing rendered after 6 seconds.\nA required script (React or Babel) most likely failed to download.');
    }
  }, 6000);
</script>
<script type="text/babel" data-presets="react">
const { useState, useMemo, useRef, useEffect } = React;

/* ---------------------------------------------------------
   DATA
--------------------------------------------------------- */
const CATEGORIES = [
  { id: "starters", label: "Starters", glyph: "◐" },
  { id: "mains", label: "Mains", glyph: "◆" },
  { id: "drinks", label: "Drinks", glyph: "◇" },
  { id: "desserts", label: "Desserts", glyph: "○" },
];

const MENU = [
  { id: 1, cat: "starters", name: "Charred Padron Peppers", price: 8.5, tag: "GF", icon: "🌶️" },
  { id: 2, cat: "starters", name: "Burrata & Blood Orange", price: 12.0, tag: "V", icon: "🍊" },
  { id: 3, cat: "starters", name: "Crispy Pork Belly Bites", price: 10.5, tag: "", icon: "🥓" },
  { id: 4, cat: "starters", name: "Smoked Beet Tartare", price: 9.0, tag: "VG", icon: "🍠" },
  { id: 5, cat: "mains", name: "Braised Short Rib", price: 26.0, tag: "", icon: "🍖" },
  { id: 6, cat: "mains", name: "Miso Glazed Salmon", price: 22.5, tag: "GF", icon: "🐟" },
  { id: 7, cat: "mains", name: "Wild Mushroom Risotto", price: 18.0, tag: "V", icon: "🍄" },
  { id: 8, cat: "mains", name: "Charcoal Grilled Ribeye", price: 34.0, tag: "GF", icon: "🥩" },
  { id: 9, cat: "mains", name: "Roasted Half Chicken", price: 21.0, tag: "", icon: "🍗" },
  { id: 10, cat: "drinks", name: "Barrel-Aged Negroni", price: 14.0, tag: "", icon: "🍸" },
  { id: 11, cat: "drinks", name: "Yuzu Highball", price: 11.0, tag: "", icon: "🥃" },
  { id: 12, cat: "drinks", name: "House Red, 6oz", price: 9.5, tag: "", icon: "🍷" },
  { id: 13, cat: "drinks", name: "Sparkling Elderflower", price: 6.0, tag: "NA", icon: "🍾" },
  { id: 14, cat: "desserts", name: "Burnt Basque Cheesecake", price: 9.5, tag: "", icon: "🍰" },
  { id: 15, cat: "desserts", name: "Dark Chocolate Fondant", price: 10.0, tag: "GF", icon: "🍫" },
  { id: 16, cat: "desserts", name: "Espresso Affogato", price: 7.5, tag: "V", icon: "☕" },
];

const TAX_RATE = 0.0875;
const TABLE_NUMBERS = Array.from({ length: 12 }, (_, i) => i + 1);
const STORAGE_KEY = "ember-ash-pos-v1";

const emptySession = () => ({
  lines: [],
  payMethod: null,
  paid: false,
  splitCount: 1,
  cashCents: 0,
  orderNo: Math.floor(1000 + Math.random() * 9000),
});

function loadSaved() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (parsed && parsed.sessions && parsed.activeTable) return parsed;
    return null;
  } catch {
    return null;
  }
}

/* ---------------------------------------------------------
   APP
--------------------------------------------------------- */
function RestaurantPOS() {
  const saved = useMemo(loadSaved, []);
  const [activeCat, setActiveCat] = useState("mains");
  const [activeTable, setActiveTable] = useState(saved?.activeTable ?? 12);
  const [sessions, setSessions] = useState(() => saved?.sessions ?? { 12: emptySession() });
  const [flashId, setFlashId] = useState(null);
  const tickTimer = useRef(null);

  // Persist to localStorage whenever the order state changes
  useEffect(() => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ sessions, activeTable }));
    } catch {
      // storage unavailable (private mode, quota, etc) — fail silently
    }
  }, [sessions, activeTable]);

  const session = sessions[activeTable] || emptySession();
  const { lines: order, payMethod, paid, splitCount, cashCents, orderNo } = session;

  function patchSession(table, patch) {
    setSessions((prev) => {
      const current = prev[table] || emptySession();
      const next = typeof patch === "function" ? patch(current) : { ...current, ...patch };
      return { ...prev, [table]: next };
    });
  }

  function switchTable(t) {
    setActiveTable(t);
    setSessions((prev) => (prev[t] ? prev : { ...prev, [t]: emptySession() }));
  }

  const items = useMemo(() => MENU.filter((m) => m.cat === activeCat), [activeCat]);

  function addItem(item) {
    patchSession(activeTable, (s) => {
      const found = s.lines.find((l) => l.id === item.id);
      const lines = found
        ? s.lines.map((l) => (l.id === item.id ? { ...l, qty: l.qty + 1 } : l))
        : [...s.lines, { ...item, qty: 1 }];
      return { ...s, lines, paid: false };
    });
    setFlashId(item.id);
    clearTimeout(tickTimer.current);
    tickTimer.current = setTimeout(() => setFlashId(null), 420);
  }

  function changeQty(id, delta) {
    patchSession(activeTable, (s) => ({
      ...s,
      paid: false,
      lines: s.lines.map((l) => (l.id === id ? { ...l, qty: l.qty + delta } : l)).filter((l) => l.qty > 0),
    }));
  }

  function removeLine(id) {
    patchSession(activeTable, (s) => ({ ...s, paid: false, lines: s.lines.filter((l) => l.id !== id) }));
  }

  function setPayMethod(m) {
    patchSession(activeTable, { payMethod: m, cashCents: 0 });
  }

  function setSplitCount(n) {
    patchSession(activeTable, { splitCount: Math.max(1, Math.min(8, n)) });
  }

  function pressKey(k) {
    patchSession(activeTable, (s) => {
      if (k === "clear") return { ...s, cashCents: 0 };
      if (k === "back") return { ...s, cashCents: Math.floor(s.cashCents / 10) };
      return { ...s, cashCents: s.cashCents * 10 + Number(k) > 9999999 ? s.cashCents : s.cashCents * 10 + Number(k) };
    });
  }

  function quickCash(cents) {
    patchSession(activeTable, { cashCents: cents });
  }

  function charge() {
    patchSession(activeTable, { paid: true });
  }

  function resetShift() {
    if (!window.confirm("Clear all tables and saved orders? This can't be undone.")) return;
    const fresh = { 12: emptySession() };
    setSessions(fresh);
    setActiveTable(12);
    try {
      localStorage.removeItem(STORAGE_KEY);
    } catch {}
  }

  const subtotal = order.reduce((s, l) => s + l.price * l.qty, 0);
  const tax = subtotal * TAX_RATE;
  const total = subtotal + tax;
  const itemCount = order.reduce((s, l) => s + l.qty, 0);
  const perGuest = splitCount > 1 ? total / splitCount : null;
  const cashGiven = cashCents / 100;
  const change = cashGiven - total;
  const occupiedTables = useMemo(
    () =>
      Object.entries(sessions).reduce((acc, [t, s]) => {
        if (s.lines.length > 0) acc[t] = s.paid;
        return acc;
      }, {}),
    [sessions]
  );

  return (
    <div className="pos-root">
      <style>{CSS}</style>

      {/* ============ LEFT: MENU ============ */}
      <div className="menu-pane">
        <header className="topbar">
          <div className="brand">
            <span className="brand-mark">✦</span>
            <div>
              <div className="brand-name">EMBER&nbsp;&amp;&nbsp;ASH</div>
              <div className="brand-sub">Front of House Terminal</div>
            </div>
          </div>
          <div className="ticket-count">
            <span className="tc-num">{Object.keys(occupiedTables).length}</span>
            <span className="tc-label">open&nbsp;checks</span>
            <button className="reset-link" onClick={resetShift}>clear all</button>
          </div>
        </header>

        <div className="table-strip">
          {TABLE_NUMBERS.map((t) => {
            const state = occupiedTables[t]; // undefined | false(open) | true(paid)
            return (
              <button
                key={t}
                className={
                  "table-chip" +
                  (t === activeTable ? " active" : "") +
                  (state === false ? " occupied" : "") +
                  (state === true ? " settled" : "")
                }
                onClick={() => switchTable(t)}
              >
                {String(t).padStart(2, "0")}
                {state === false && <span className="table-dot" />}
                {state === true && <span className="table-check">✓</span>}
              </button>
            );
          })}
        </div>

        <nav className="cat-tabs">
          {CATEGORIES.map((c) => (
            <button
              key={c.id}
              className={"cat-tab" + (activeCat === c.id ? " active" : "")}
              onClick={() => setActiveCat(c.id)}
            >
              <span className="cat-glyph">{c.glyph}</span>
              {c.label}
            </button>
          ))}
        </nav>

        <div className="menu-grid">
          {items.map((item) => (
            <button
              key={item.id}
              className={"menu-card" + (flashId === item.id ? " flash" : "")}
              onClick={() => addItem(item)}
            >
              {item.tag && <span className="menu-tag">{item.tag}</span>}
              <span className="menu-icon">{item.icon}</span>
              <span className="menu-name">{item.name}</span>
              <span className="menu-price">${item.price.toFixed(2)}</span>
              <span className="menu-add">+ ADD</span>
            </button>
          ))}
        </div>
      </div>

      {/* ============ RIGHT: TICKET ============ */}
      <div className="ticket-pane">
        <div className="ticket">
          <div className="ticket-perf" />
          <div className="ticket-head">
            <div className="ticket-title">GUEST CHECK</div>
            <div className="ticket-meta">
              <span>ORDER #{orderNo}</span>
              <span>TABLE {String(activeTable).padStart(2, "0")}</span>
            </div>
            <div className="ticket-rule" />
          </div>

          <div className="ticket-lines">
            {order.length === 0 && (
              <div className="ticket-empty">
                <span>— no items fired —</span>
                <p>Tap a menu item to send it to the ticket.</p>
              </div>
            )}
            {order.map((line) => (
              <div className="ticket-line" key={line.id}>
                <div className="tl-top">
                  <span className="tl-qty">{line.qty}×</span>
                  <span className="tl-name">{line.name}</span>
                  <span className="tl-price">${(line.price * line.qty).toFixed(2)}</span>
                </div>
                <div className="tl-controls">
                  <button onClick={() => changeQty(line.id, -1)} aria-label="decrease">−</button>
                  <button onClick={() => changeQty(line.id, 1)} aria-label="increase">+</button>
                  <button className="tl-void" onClick={() => removeLine(line.id)}>void</button>
                </div>
              </div>
            ))}
          </div>

          <div className="ticket-rule dashed" />

          <div className="ticket-totals">
            <div className="tt-row"><span>Items</span><span>{itemCount}</span></div>
            <div className="tt-row"><span>Subtotal</span><span>${subtotal.toFixed(2)}</span></div>
            <div className="tt-row"><span>Tax (8.75%)</span><span>${tax.toFixed(2)}</span></div>
            <div className="tt-row tt-total">
              <span>Total</span>
              <span className={paid ? "stamp-total paid" : "stamp-total"}>${total.toFixed(2)}</span>
            </div>
          </div>

          <div className="split-row">
            <span className="split-label">Split</span>
            <div className="split-stepper">
              <button onClick={() => setSplitCount(splitCount - 1)} disabled={splitCount <= 1}>−</button>
              <span>{splitCount} {splitCount === 1 ? "guest" : "guests"}</span>
              <button onClick={() => setSplitCount(splitCount + 1)} disabled={splitCount >= 8}>+</button>
            </div>
            {perGuest && <span className="split-amount">${perGuest.toFixed(2)} / guest</span>}
          </div>

          {paid && (
            <div className="paid-stamp">
              <span>PAID</span>
            </div>
          )}
        </div>

        <div className="pay-dock">
          <div className="pay-methods">
            {["Card", "Cash", "Comp"].map((m) => (
              <button
                key={m}
                className={"pay-chip" + (payMethod === m ? " active" : "")}
                disabled={order.length === 0}
                onClick={() => setPayMethod(m)}
              >
                {m}
              </button>
            ))}
          </div>

          {payMethod === "Cash" && !paid && (
            <div className="cash-panel">
              <div className="cash-readout">
                <div className="cash-given">
                  <label>Tendered</label>
                  <span>${cashGiven.toFixed(2)}</span>
                </div>
                <div className={"cash-change" + (change >= 0 ? " ok" : " short")}>
                  <label>{change >= 0 ? "Change due" : "Remaining"}</label>
                  <span>${Math.abs(change).toFixed(2)}</span>
                </div>
              </div>
              <div className="cash-quick">
                {[total, 20, 50, 100].map((v, i) => (
                  <button key={i} onClick={() => quickCash(Math.round(v * 100))}>
                    {i === 0 ? "Exact" : `$${v}`}
                  </button>
                ))}
              </div>
              <div className="keypad">
                {["1", "2", "3", "4", "5", "6", "7", "8", "9", "clear", "0", "back"].map((k) => (
                  <button key={k} className={k === "clear" || k === "back" ? "keypad-fn" : ""} onClick={() => pressKey(k)}>
                    {k === "back" ? "⌫" : k === "clear" ? "C" : k}
                  </button>
                ))}
              </div>
            </div>
          )}

          <button
            className="fire-btn"
            disabled={order.length === 0 || !payMethod || paid || (payMethod === "Cash" && change < 0)}
            onClick={charge}
          >
            {paid ? "✓ Payment Captured" : `Charge $${total.toFixed(2)}`}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   CSS — the "ticket printer" identity
--------------------------------------------------------- */
const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

:root{
  --charcoal:#18100D;
  --charcoal-2:#241811;
  --charcoal-3:#2E1F16;
  --paper:#F4EEDD;
  --paper-line:#DED2AF;
  --copper:#C9762C;
  --copper-light:#E8A25B;
  --sage:#6E8F63;
  --rust:#A63D2F;
  --ink:#2A2118;
  --ink-soft:#6B5D4B;
}

*{box-sizing:border-box;}

.pos-root{
  display:flex;
  width:100%;
  min-height:100vh;
  background:
    radial-gradient(ellipse at top left, #241811 0%, transparent 55%),
    var(--charcoal);
  font-family:'Inter', sans-serif;
  color:var(--paper);
  overflow:hidden;
}

/* ============ MENU PANE ============ */
.menu-pane{
  flex:1 1 62%;
  display:flex;
  flex-direction:column;
  padding:28px 32px 20px;
  min-width:0;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding-bottom:20px;
  border-bottom:1px solid rgba(232,162,91,0.16);
  margin-bottom:22px;
}
.brand{display:flex;align-items:center;gap:12px;}
.brand-mark{
  font-size:22px;
  color:var(--copper-light);
  filter:drop-shadow(0 0 8px rgba(201,118,44,0.55));
}
.brand-name{
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;
  font-size:19px;
  letter-spacing:0.06em;
  color:var(--paper);
}
.brand-sub{
  font-size:11px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--ink-soft);
  margin-top:2px;
}
.ticket-count{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;}
.tc-num{
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;color:var(--copper-light);
}
.tc-label{font-size:10px;letter-spacing:0.1em;color:var(--ink-soft);text-transform:uppercase;}
.reset-link{
  margin-top:6px;
  background:none;border:none;
  font-size:10px;letter-spacing:0.06em;
  color:var(--rust);
  cursor:pointer;
  text-decoration:underline;
  text-underline-offset:2px;
  opacity:0.75;
  transition:opacity .15s ease;
}
.reset-link:hover{opacity:1;}

.table-strip{
  display:flex;gap:8px;overflow-x:auto;padding-bottom:14px;margin-bottom:6px;
  border-bottom:1px solid rgba(244,238,221,0.08);
}
.table-strip::-webkit-scrollbar{height:4px;}
.table-strip::-webkit-scrollbar-thumb{background:rgba(232,162,91,0.25);border-radius:4px;}
.table-chip{
  position:relative;
  flex:0 0 auto;
  min-width:44px;
  padding:8px 10px;
  border-radius:9px;
  border:1px solid rgba(244,238,221,0.12);
  background:var(--charcoal-2);
  color:var(--ink-soft);
  font-family:'JetBrains Mono',monospace;
  font-weight:600;font-size:12.5px;
  cursor:pointer;
  transition:all .15s ease;
}
.table-chip:hover{border-color:rgba(232,162,91,0.4);color:var(--paper);}
.table-chip.occupied{color:var(--copper-light);border-color:rgba(232,162,91,0.3);}
.table-chip.settled{color:var(--sage);border-color:rgba(110,143,99,0.4);}
.table-chip.active{
  background:linear-gradient(135deg,var(--copper),#A85F22);
  color:#1B1108;border-color:transparent;
}
.table-dot{
  position:absolute;top:5px;right:6px;width:5px;height:5px;border-radius:50%;
  background:var(--copper-light);
}
.table-chip.active .table-dot{background:#1B1108;}
.table-check{position:absolute;top:3px;right:5px;font-size:9px;}

.cat-tabs{
  display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap;
}
.cat-tab{
  display:flex;align-items:center;gap:8px;
  padding:10px 18px;
  border-radius:999px;
  border:1px solid rgba(244,238,221,0.12);
  background:transparent;
  color:var(--ink-soft);
  font-family:'Space Grotesk',sans-serif;
  font-weight:600;font-size:13px;letter-spacing:0.04em;
  cursor:pointer;
  transition:all .18s ease;
}
.cat-glyph{font-size:11px;opacity:0.7;}
.cat-tab:hover{border-color:rgba(232,162,91,0.4);color:var(--paper);}
.cat-tab.active{
  background:linear-gradient(135deg,var(--copper),#A85F22);
  color:#1B1108;
  border-color:transparent;
  box-shadow:0 6px 18px -6px rgba(201,118,44,0.6);
}
.cat-tab.active .cat-glyph{opacity:1;}

.menu-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(168px,1fr));
  gap:14px;
  overflow-y:auto;
  padding-right:6px;
  padding-bottom:12px;
}
.menu-grid::-webkit-scrollbar{width:6px;}
.menu-grid::-webkit-scrollbar-thumb{background:rgba(232,162,91,0.25);border-radius:4px;}

.menu-card{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:6px;
  padding:16px 14px 14px;
  background:linear-gradient(165deg,var(--charcoal-2),var(--charcoal-3));
  border:1px solid rgba(244,238,221,0.08);
  border-radius:14px;
  cursor:pointer;
  text-align:left;
  transition:transform .16s ease, border-color .16s ease, box-shadow .16s ease;
  overflow:hidden;
}
.menu-card::after{
  content:"";
  position:absolute;inset:0;
  background:radial-gradient(140px 80px at 20% 0%, rgba(232,162,91,0.14), transparent 70%);
  opacity:0;
  transition:opacity .2s ease;
}
.menu-card:hover{
  transform:translateY(-3px);
  border-color:rgba(232,162,91,0.35);
  box-shadow:0 14px 28px -14px rgba(0,0,0,0.6);
}
.menu-card:hover::after{opacity:1;}
.menu-card:active{transform:translateY(-1px) scale(0.98);}

.menu-card.flash{
  animation:cardFlash .42s ease;
}
@keyframes cardFlash{
  0%{box-shadow:0 0 0 0 rgba(232,162,91,0.7);}
  60%{box-shadow:0 0 0 10px rgba(232,162,91,0);}
  100%{box-shadow:0 0 0 0 rgba(232,162,91,0);}
}

.menu-tag{
  position:absolute;top:10px;right:10px;
  font-size:9px;font-weight:700;letter-spacing:0.06em;
  padding:3px 7px;border-radius:5px;
  background:rgba(110,143,99,0.18);
  color:var(--sage);
  border:1px solid rgba(110,143,99,0.35);
}
.menu-icon{font-size:26px;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.4));}
.menu-name{
  font-family:'Space Grotesk',sans-serif;
  font-weight:600;font-size:14px;color:var(--paper);
  line-height:1.25;
}
.menu-price{
  font-family:'JetBrains Mono',monospace;
  font-size:13px;color:var(--copper-light);font-weight:600;
}
.menu-add{
  margin-top:4px;
  font-size:10px;letter-spacing:0.12em;font-weight:600;
  color:var(--ink-soft);
}
.menu-card:hover .menu-add{color:var(--copper-light);}

/* ============ TICKET PANE ============ */
.ticket-pane{
  flex:0 0 400px;
  max-width:400px;
  background:linear-gradient(180deg,#120C09,#0D0907);
  padding:26px 24px;
  display:flex;
  flex-direction:column;
  gap:16px;
  border-left:1px solid rgba(232,162,91,0.14);
  min-height:100vh;
}

.ticket{
  position:relative;
  background:var(--paper);
  color:var(--ink);
  border-radius:4px;
  padding:22px 22px 18px;
  box-shadow:0 20px 45px -18px rgba(0,0,0,0.65), 0 0 0 1px rgba(0,0,0,0.04);
  flex:1;
  display:flex;
  flex-direction:column;
  min-height:0;
  overflow:hidden;
}
/* perforated torn top edge, signature detail */
.ticket-perf{
  position:absolute;
  top:-9px;left:0;right:0;height:18px;
  background:
    radial-gradient(circle at 10px 9px, transparent 7px, var(--paper) 7.5px) 0 0/20px 18px repeat-x;
}

.ticket-head{font-family:'JetBrains Mono',monospace;}
.ticket-title{
  font-weight:700;font-size:15px;letter-spacing:0.2em;text-align:center;
  margin-bottom:8px;
}
.ticket-meta{
  display:flex;justify-content:space-between;
  font-size:11px;color:var(--ink-soft);letter-spacing:0.04em;
  margin-bottom:10px;
}
.ticket-rule{
  height:1px;background:var(--paper-line);margin:6px 0 10px;
}
.ticket-rule.dashed{
  background:repeating-linear-gradient(90deg,var(--paper-line) 0 6px, transparent 6px 11px);
  height:1px;
}

.ticket-lines{
  flex:1;
  overflow-y:auto;
  font-family:'JetBrains Mono',monospace;
  padding-right:2px;
}
.ticket-lines::-webkit-scrollbar{width:5px;}
.ticket-lines::-webkit-scrollbar-thumb{background:var(--paper-line);border-radius:3px;}

.ticket-empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;text-align:center;color:var(--ink-soft);gap:6px;padding:30px 10px;
}
.ticket-empty span{font-weight:600;letter-spacing:0.08em;font-size:12px;}
.ticket-empty p{font-size:11px;max-width:180px;font-family:'Inter',sans-serif;margin:0;}

.ticket-line{
  padding:9px 0;
  border-bottom:1px dashed var(--paper-line);
  animation:printIn .3s ease;
}
@keyframes printIn{
  from{opacity:0; transform:translateY(-6px);}
  to{opacity:1; transform:translateY(0);}
}
.tl-top{
  display:flex;align-items:baseline;gap:8px;font-size:13px;
}
.tl-qty{color:var(--copper);font-weight:700;min-width:22px;}
.tl-name{flex:1;font-weight:500;}
.tl-price{font-weight:600;}
.tl-controls{
  display:flex;gap:6px;margin-top:6px;margin-left:30px;
}
.tl-controls button{
  font-family:'Inter',sans-serif;
  border:1px solid var(--paper-line);
  background:transparent;
  color:var(--ink-soft);
  border-radius:5px;
  width:22px;height:20px;
  font-size:12px;
  cursor:pointer;
  transition:all .15s ease;
}
.tl-controls button:hover{border-color:var(--copper);color:var(--copper);}
.tl-void{
  width:auto !important;padding:0 8px;
  margin-left:auto;
  font-size:9px !important;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--rust) !important;
}
.tl-void:hover{border-color:var(--rust) !important;background:rgba(166,61,47,0.08);}

.ticket-totals{
  font-family:'JetBrains Mono',monospace;
  font-size:12.5px;
}
.tt-row{
  display:flex;justify-content:space-between;padding:3px 0;color:var(--ink-soft);
}
.tt-total{
  margin-top:6px;padding-top:8px;
  border-top:1px solid var(--ink);
  font-size:17px;font-weight:700;color:var(--ink);
}
.stamp-total{font-variant-numeric:tabular-nums;}
.stamp-total.paid{color:var(--sage);}

.split-row{
  display:flex;align-items:center;gap:10px;
  margin-top:12px;padding-top:10px;
  border-top:1px dashed var(--paper-line);
  font-family:'JetBrains Mono',monospace;
  flex-wrap:wrap;
}
.split-label{font-size:10px;letter-spacing:0.12em;color:var(--ink-soft);text-transform:uppercase;}
.split-stepper{display:flex;align-items:center;gap:8px;}
.split-stepper span{font-size:11.5px;color:var(--ink);min-width:64px;}
.split-stepper button{
  width:20px;height:20px;border-radius:5px;border:1px solid var(--paper-line);
  background:transparent;color:var(--ink-soft);font-size:12px;cursor:pointer;
  transition:all .15s ease;
}
.split-stepper button:hover:not(:disabled){border-color:var(--copper);color:var(--copper);}
.split-stepper button:disabled{opacity:0.3;cursor:not-allowed;}
.split-amount{
  margin-left:auto;font-size:12px;font-weight:700;color:var(--copper);
}

.paid-stamp{
  position:absolute;
  top:38%; right:14px;
  transform:rotate(-14deg);
  border:3px solid var(--sage);
  color:var(--sage);
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;
  font-size:20px;
  letter-spacing:0.15em;
  padding:5px 14px;
  border-radius:6px;
  opacity:0.85;
  animation:stampIn .35s cubic-bezier(.3,1.6,.5,1);
  pointer-events:none;
}
@keyframes stampIn{
  0%{opacity:0; transform:rotate(-14deg) scale(1.8);}
  70%{opacity:0.9; transform:rotate(-14deg) scale(0.95);}
  100%{opacity:0.85; transform:rotate(-14deg) scale(1);}
}

.pay-dock{
  display:flex;flex-direction:column;gap:10px;
}
.pay-methods{display:flex;gap:8px;}
.pay-chip{
  flex:1;
  padding:10px 0;
  border-radius:9px;
  border:1px solid rgba(244,238,221,0.14);
  background:var(--charcoal-2);
  color:var(--paper);
  font-family:'Space Grotesk',sans-serif;
  font-weight:600;font-size:12.5px;
  cursor:pointer;
  transition:all .16s ease;
}
.pay-chip:disabled{opacity:0.35;cursor:not-allowed;}
.pay-chip:hover:not(:disabled){border-color:rgba(232,162,91,0.5);}
.pay-chip.active{
  background:linear-gradient(135deg,var(--copper),#A85F22);
  border-color:transparent;color:#1B1108;
}

.cash-panel{
  background:var(--charcoal-2);
  border:1px solid rgba(232,162,91,0.16);
  border-radius:12px;
  padding:12px;
  display:flex;flex-direction:column;gap:10px;
  animation:printIn .2s ease;
}
.cash-readout{display:flex;gap:8px;}
.cash-given,.cash-change{
  flex:1;
  background:rgba(244,238,221,0.04);
  border-radius:8px;padding:8px 10px;
}
.cash-given label,.cash-change label{
  display:block;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:2px;
}
.cash-given span{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;color:var(--paper);}
.cash-change span{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;color:var(--ink-soft);}
.cash-change.ok span{color:var(--sage);}
.cash-change.short span{color:var(--rust);}

.cash-quick{display:flex;gap:6px;}
.cash-quick button{
  flex:1;padding:7px 0;border-radius:7px;border:1px solid rgba(244,238,221,0.14);
  background:transparent;color:var(--paper);font-family:'JetBrains Mono',monospace;
  font-size:11.5px;font-weight:600;cursor:pointer;transition:all .15s ease;
}
.cash-quick button:hover{border-color:var(--copper-light);color:var(--copper-light);}

.keypad{
  display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
}
.keypad button{
  padding:10px 0;border-radius:7px;border:1px solid rgba(244,238,221,0.1);
  background:rgba(244,238,221,0.03);color:var(--paper);
  font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;
  cursor:pointer;transition:all .12s ease;
}
.keypad button:hover{background:rgba(232,162,91,0.14);border-color:rgba(232,162,91,0.3);}
.keypad button:active{transform:scale(0.95);}
.keypad-fn{color:var(--copper-light) !important;font-size:12px !important;}

.fire-btn{
  padding:15px 0;
  border-radius:10px;
  border:none;
  background:linear-gradient(135deg,var(--copper-light),var(--copper));
  color:#1B1108;
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;font-size:14.5px;letter-spacing:0.03em;
  cursor:pointer;
  box-shadow:0 12px 24px -10px rgba(201,118,44,0.55);
  transition:transform .14s ease, box-shadow .14s ease, opacity .14s ease;
}
.fire-btn:disabled{
  opacity:0.35;cursor:not-allowed;box-shadow:none;
}
.fire-btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 16px 30px -10px rgba(201,118,44,0.7);}
.fire-btn:active:not(:disabled){transform:translateY(0px) scale(0.99);}

@media (max-width: 880px){
  .pos-root{flex-direction:column;}
  .ticket-pane{max-width:none;min-height:auto;}
}
`;
